# Repo-local checks carried through from vendored lefthook.yml (#126).
---

remotes:
  - git_url: https://github.com/pr0d1r2/nix-lefthook-markdownlint
    ref: main
    configs:
      - lefthook-remote.yml

pre-commit:
  commands:
    bats-parse:
      glob: "*.bats"
      run: timeout ${LEFTHOOK_BATS_PARSE_TIMEOUT:-30} lefthook-bats-parse {staged_files}


pre-push:
  commands:
    bats-parse:
      glob: "*.bats"
      run: timeout ${LEFTHOOK_BATS_PARSE_TIMEOUT:-30} lefthook-bats-parse {push_files}
